<div class="graficas-section">

  <!-- ───────────────────────── GRÁFICA 1 (porcentajes) ───────────────── -->
  <div class="grafica-card">
    <svg viewBox="0 0 340 310" class="donut-svg">

      <!-- Anillo relleno (bordes cuadrados) -->
      <circle [attr.cx]="CX" [attr.cy]="CY" [attr.r]="ringL.r"
        fill="none" stroke="#3d1270"
        [attr.stroke-width]="ringL.sw"
        stroke-linecap="butt"
        [attr.stroke-dasharray]="ringL.fgDash"
        [attr.transform]="'rotate(' + ringL.rot + ',' + CX + ',' + CY + ')'"
        class="ring-arc"/>

      <!-- Círculo interior rosa -->
      <circle [attr.cx]="CX" [attr.cy]="CY" [attr.r]="rInner" fill="#e91e8c" class="inner-circle"/>

      <!-- "100.0000%" dentro del rosa -->
      <text [attr.x]="CX" [attr.y]="CY + 2" class="txt-inner-pct">{{ animPctInnerStr }}</text>

      <!-- Porcentaje centrado en la franja morada inferior (entre rosa y anillo) -->
      <text [attr.x]="CX" [attr.y]="CY + 82" class="txt-ring-pct">{{ animPctStr }}</text>

      <!-- ── Callout superior: sube vertical → gira 90° derecha ── -->
      <polyline points="170,93 170,47 248,47" class="callout-line"/>
      <text x="252" y="40" class="txt-val-pink">{{ animAprobadaStr }}</text>
      <text x="252" y="55" class="txt-label-bold">{{ datos.etiquetaAprobada }}</text>

      <!-- ── Callout inferior-izq: diagonal 45° abajo-izq → gira horizontal ── -->
      <polyline points="96,217 56,257 5,257" class="callout-line"/>
      <text x="5" y="273" class="txt-val-purple">{{ animContabilizadaStr }}</text>
      <text x="5" y="286" class="txt-label">Lista nominal de actas</text>
      <text x="5" y="298" class="txt-label">contabilizadas</text>

    </svg>
  </div>

  <!-- ───────────────────────── GRÁFICA 2 (valores) ───────────────────── -->
  <div class="grafica-card">
    <svg viewBox="0 0 340 310" class="donut-svg">

      <!-- Anillo relleno (bordes cuadrados) -->
      <circle [attr.cx]="CX" [attr.cy]="CY" [attr.r]="ringR.r"
        fill="none" stroke="#3d1270"
        [attr.stroke-width]="ringR.sw"
        stroke-linecap="butt"
        [attr.stroke-dasharray]="ringR.fgDash"
        [attr.transform]="'rotate(' + ringR.rot + ',' + CX + ',' + CY + ')'"
        class="ring-arc"/>

      <!-- Círculo interior rosa -->
      <circle [attr.cx]="CX" [attr.cy]="CY" [attr.r]="rInner" fill="#e91e8c" class="inner-circle"/>

      <!-- Texto dentro: etiqueta + valor -->
      <text [attr.x]="CX" [attr.y]="CY - 12" class="txt-inner-label-sm">Lista nominal</text>
      <text [attr.x]="CX" [attr.y]="CY + 2"  class="txt-inner-label-sm">aprobada</text>
      <text [attr.x]="CX" [attr.y]="CY + 22" class="txt-inner-val-lg">{{ animAprobadaStr }}</text>

      <!-- ── Callout derecho: diagonal arriba-der → gira horizontal ── -->
      <polyline points="238,113 268,93 288,93" class="callout-line"/>
      <text x="288" y="87" class="txt-label">Lista nominal de actas</text>
      <text x="288" y="100" class="txt-label">contabilizadas</text>
      <text x="288" y="120" class="txt-val-purple-lg">{{ animContabilizadaStr }}</text>

    </svg>
  </div>

</div>
